name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install

      - name: Build all packages
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Package OpenAPI spec
        run: |
          mkdir -p release-assets
          cp openapi/openapi.yaml release-assets/openapi.yaml

      - name: Package TypeScript SDK
        run: |
          cd sdks/typescript
          tar -czvf ../../release-assets/sdk-typescript.tar.gz .

      - name: Package Python SDK
        run: |
          cd sdks/python
          tar -czvf ../../release-assets/sdk-python.tar.gz .

      - name: Package C# SDK
        run: |
          cd sdks/dotnet
          tar -czvf ../../release-assets/sdk-dotnet.tar.gz .

      - name: Package Java SDK
        run: |
          cd sdks/java
          tar -czvf ../../release-assets/sdk-java.tar.gz .

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/openapi.yaml
            release-assets/sdk-typescript.tar.gz
            release-assets/sdk-python.tar.gz
            release-assets/sdk-dotnet.tar.gz
            release-assets/sdk-java.tar.gz
            release-assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

