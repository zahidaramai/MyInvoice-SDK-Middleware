name: OpenAPI Lint

on:
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - ".spectral.yaml"
  pull_request:
    branches: [main]
    paths:
      - "openapi/**"
      - ".spectral.yaml"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Lint OpenAPI spec
        run: npx --yes @stoplight/spectral-cli lint openapi/openapi.yaml --ruleset .spectral.yaml
