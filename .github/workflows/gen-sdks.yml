name: Generate SDKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "openapi/openapi.yaml"
      - "openapi-generator/*.json"

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate TypeScript SDK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/openapi/openapi.yaml \
            -g typescript-axios \
            -o /local/sdks/typescript \
            -c /local/openapi-generator/typescript-axios.config.json \
            --additional-properties=hideGenerationTimestamp=true

      - name: Generate Python SDK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/openapi/openapi.yaml \
            -g python \
            -o /local/sdks/python \
            -c /local/openapi-generator/python.config.json \
            --additional-properties=hideGenerationTimestamp=true

      - name: Generate C# SDK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/openapi/openapi.yaml \
            -g csharp \
            -o /local/sdks/dotnet \
            -c /local/openapi-generator/csharp.config.json \
            --additional-properties=hideGenerationTimestamp=true

      - name: Generate Java SDK
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/local" \
            openapitools/openapi-generator-cli:v7.10.0 generate \
            -i /local/openapi/openapi.yaml \
            -g java \
            -o /local/sdks/java \
            -c /local/openapi-generator/java.config.json \
            --additional-properties=hideGenerationTimestamp=true

      - name: Fix SDK directory ownership
        run: sudo chown -R $USER:$USER sdks/

      - name: Add SDK .gitignore files
        run: |
          # TypeScript
          cat > sdks/typescript/.gitignore << 'EOF'
          # Build artifacts
          dist/
          node_modules/
          *.tgz

          # IDE
          .idea/
          .vscode/
          *.swp
          EOF

          # Python
          cat > sdks/python/.gitignore << 'EOF'
          # Byte-compiled / optimized
          __pycache__/
          *.py[cod]
          *$py.class

          # Distribution / packaging
          dist/
          build/
          *.egg-info/
          .eggs/

          # Virtual environments
          venv/
          .venv/
          ENV/

          # IDE
          .idea/
          .vscode/
          *.swp
          EOF

          # C#
          cat > sdks/dotnet/.gitignore << 'EOF'
          # Build results
          bin/
          obj/
          *.nupkg

          # IDE
          .vs/
          .idea/
          *.user
          *.suo
          EOF

          # Java
          cat > sdks/java/.gitignore << 'EOF'
          # Build results
          target/
          build/
          *.jar

          # IDE
          .idea/
          .gradle/
          *.iml

          # Maven
          pom.xml.tag
          pom.xml.releaseBackup
          pom.xml.versionsBackup
          EOF

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(sdks): regenerate SDKs from OpenAPI spec"
          title: "chore(sdks): Regenerate SDKs from OpenAPI spec"
          body: |
            This PR was automatically generated by the SDK generation workflow.

            ## Changes
            - Updated TypeScript SDK (`sdks/typescript/`)
            - Updated Python SDK (`sdks/python/`)
            - Updated C# SDK (`sdks/dotnet/`)
            - Updated Java SDK (`sdks/java/`)

            ## Trigger
            Changes detected in:
            - `openapi/openapi.yaml`
            - `openapi-generator/*.json`

            ---
            *This PR was auto-generated by GitHub Actions*
          branch: chore/regenerate-sdks
          delete-branch: true
          labels: |
            automated
            sdk
