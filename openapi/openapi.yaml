openapi: 3.0.3
info:
  title: KLCubeLHDN MyInvois Middleware API
  description: |
    API middleware gateway for Malaysia's MyInvois e-invoicing system (LHDN).

    **Version:** 1.1.1

    ## Features
    - 4 Submission Endpoints (Consolidate, JustSave, Buyer, Personal)
    - JWT Authentication with Access & Refresh Tokens
    - User/Role/Company Management
    - Document Operations (List, Status, PDF, Cancel)
    - Digital Signing v1.1 (XAdES signatures)
    - Background Status Polling

    ## Authentication
    All endpoints except `/api/v1/auth/login` require JWT authentication.
    Include the access token in the Authorization header:
    ```
    Authorization: Bearer <access_token>
    ```
  version: 1.1.1
  contact:
    name: MyInvois SDK Middleware
    email: hello@zahidaramai.com

servers:
  - url: http://localhost:3000
    description: Local Development
  - url: https://localhost:3000
    description: Production

tags:
  - name: Health
    description: Health and readiness checks
  - name: Authentication
    description: JWT authentication endpoints
  - name: KLCubeLHDN Submission
    description: Invoice submission endpoints
  - name: Documents
    description: Document operations
  - name: Users
    description: User management
  - name: Roles
    description: Role management
  - name: Companies
    description: Company management

paths:
  # ============================================================================
  # Health Endpoints
  # ============================================================================
  /healthz:
    get:
      operationId: healthCheck
      summary: Health check
      description: Returns OK if the gateway is running
      tags: [Health]
      responses:
        "200":
          description: Gateway is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /readyz:
    get:
      operationId: readinessCheck
      summary: Readiness check
      description: Returns OK if all dependencies (DB, Redis) are connected
      tags: [Health]
      responses:
        "200":
          description: Gateway is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /version:
    get:
      operationId: getVersion
      summary: Version information
      description: Returns the current API version and build information
      tags: [Health]
      responses:
        "200":
          description: Version information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ============================================================================
  # Authentication Endpoints
  # ============================================================================
  /api/v1/auth/login:
    post:
      operationId: login
      summary: Login
      description: Authenticate with email/password, returns access and refresh tokens
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Logout
      description: Invalidate current tokens
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      summary: Refresh access token
      description: Exchange refresh token for new access token
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Token refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      summary: Get current user
      description: Returns details of the authenticated user
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/switch-company:
    post:
      operationId: switchCompany
      summary: Switch active company
      description: Switch to a different company context
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyId]
              properties:
                companyId:
                  type: string
      responses:
        "200":
          description: Company switched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  # ============================================================================
  # KLCubeLHDN Submission Endpoints
  # ============================================================================
  /api/v1/klcubelhdn/submit-consolidate:
    post:
      operationId: submitConsolidate
      summary: Submit consolidated invoice
      description: |
        Combine multiple invoices into one e-invoice submission.
        Supports v1.0 (unsigned) and v1.1 (digitally signed) documents.
      tags: [KLCubeLHDN Submission]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitConsolidateRequest"
      responses:
        "201":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/klcubelhdn/submit-justsave:
    post:
      operationId: submitJustSave
      summary: Save invoice locally
      description: Save invoice to database without submitting to LHDN
      tags: [KLCubeLHDN Submission]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitJustSaveRequest"
      responses:
        "201":
          description: Invoice saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/klcubelhdn/submit-buyer:
    post:
      operationId: submitBuyer
      summary: Submit B2B invoice
      description: Submit invoice with buyer TIN + BRN (Business Registration Number)
      tags: [KLCubeLHDN Submission]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitBuyerRequest"
      responses:
        "201":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/klcubelhdn/submit-personal:
    post:
      operationId: submitPersonal
      summary: Submit B2C invoice
      description: Submit invoice with buyer NRIC (personal identification)
      tags: [KLCubeLHDN Submission]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitPersonalRequest"
      responses:
        "201":
          description: Submission accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/klcubelhdn/invoices/{trackingId}:
    get:
      operationId: getInvoiceByTrackingId
      summary: Get invoice by tracking ID
      description: Retrieve invoice details including status, MyInvois UUID, and submission history
      tags: [KLCubeLHDN Submission]
      security:
        - bearerAuth: []
      parameters:
        - name: trackingId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceDetails"
        "404":
          $ref: "#/components/responses/NotFound"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  # ============================================================================
  # Document Operations Endpoints
  # ============================================================================
  /api/v1/documents:
    get:
      operationId: listDocuments
      summary: List documents
      description: List documents with optional filters
      tags: [Documents]
      security:
        - bearerAuth: []
      parameters:
        - name: companyId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, VALID, INVALID, CANCELLED]
        - name: invoiceType
          in: query
          schema:
            type: string
            enum: [CONSOLIDATE, JUSTSAVE, BUYER, PERSONAL]
        - name: fromDate
          in: query
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/documents/{uuid}/status:
    get:
      operationId: getDocumentStatus
      summary: Get document status
      description: Get the current validation status of a submitted document from MyInvois
      tags: [Documents]
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentStatusResponse"
        "404":
          $ref: "#/components/responses/NotFound"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/documents/{uuid}/pdf:
    get:
      operationId: getDocumentPdf
      summary: Download document PDF
      description: Download the PDF representation of a validated document from MyInvois
      tags: [Documents]
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Document data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPdfResponse"
        "404":
          $ref: "#/components/responses/NotFound"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/documents/{uuid}/cancel:
    post:
      operationId: cancelDocument
      summary: Cancel document
      description: Cancel a submitted document (within 72 hours)
      tags: [Documents]
      security:
        - bearerAuth: []
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Document cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                  status:
                    type: string
                    example: CANCELLED
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  # ============================================================================
  # User Management Endpoints
  # ============================================================================
  /api/v1/users:
    get:
      operationId: listUsers
      summary: List users
      description: List all users with pagination and optional search filter
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"

        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createUser
      summary: Create user
      description: Create a new user with email, name, and role assignment
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/users/{id}:
    get:
      operationId: getUser
      summary: Get user by ID
      description: Retrieve user details including role and company assignments
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/NotFound"

        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: updateUser
      summary: Update user
      description: Update user details such as name, email, or active status
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deleteUser
      summary: Delete user
      description: Permanently delete a user from the system
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/users/{id}/role:
    put:
      operationId: updateUserRole
      summary: Update user role
      description: Assign a different role to a user
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleId]
              properties:
                roleId:
                  type: string
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  # ============================================================================
  # Role Management Endpoints
  # ============================================================================
  /api/v1/roles:
    get:
      operationId: listRoles
      summary: List roles
      description: List all roles with pagination
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"

        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createRole
      summary: Create role
      description: Create a new role with specified permissions
      tags: [Roles]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/roles/all:
    get:
      operationId: listAllRoles
      summary: List all roles (no pagination)
      description: Returns all roles without pagination for dropdowns and selectors
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Role"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/roles/permissions:
    get:
      operationId: listPermissions
      summary: List available permissions
      description: Returns all available permission strings that can be assigned to roles
      tags: [Roles]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Available permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
                    example:
                      - submit:invoice
                      - read:documents
                      - cancel:documents
                      - manage:users
                      - manage:roles
                      - manage:companies
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/roles/{id}:
    get:
      operationId: getRole
      summary: Get role by ID
      description: Retrieve role details including assigned permissions
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Role details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: updateRole
      summary: Update role
      description: Update role name, description, or permissions
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoleRequest"
      responses:
        "200":
          description: Role updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deleteRole
      summary: Delete role
      description: Permanently delete a role (fails if users are assigned)
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Role deleted

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/roles/{id}/permissions:
    put:
      operationId: updateRolePermissions
      summary: Update role permissions
      description: Replace the permissions assigned to a role
      tags: [Roles]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permissions]
              properties:
                permissions:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Permissions updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

        "429":
          $ref: "#/components/responses/TooManyRequests"
  # ============================================================================
  # Company Management Endpoints
  # ============================================================================
  /api/v1/companies:
    get:
      operationId: listCompanies
      summary: List companies
      description: List all companies with pagination
      tags: [Companies]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Company list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyListResponse"

        "429":
          $ref: "#/components/responses/TooManyRequests"
    post:
      operationId: createCompany
      summary: Create company
      description: Create a new company with TIN and business registration details
      tags: [Companies]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/companies/all:
    get:
      operationId: listAllCompanies
      summary: List all companies (no pagination)
      description: Returns all companies without pagination for dropdowns and selectors
      tags: [Companies]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All companies
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Company"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/companies/{id}:
    get:
      operationId: getCompany
      summary: Get company by ID
      description: Retrieve company details including TIN and MyInvois configuration
      tags: [Companies]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

        "429":
          $ref: "#/components/responses/TooManyRequests"
    put:
      operationId: updateCompany
      summary: Update company
      description: Update company details such as name, address, or contact information
      tags: [Companies]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCompanyRequest"
      responses:
        "200":
          description: Company updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deleteCompany
      summary: Delete company
      description: Permanently delete a company and all associated data
      tags: [Companies]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Company deleted

        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/v1/companies/{id}/credentials:
    put:
      operationId: updateCompanyCredentials
      summary: Set MyInvois credentials
      description: Configure the company's MyInvois API credentials
      tags: [Companies]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCredentialsRequest"
      responses:
        "200":
          description: Credentials updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/companies/{id}/users/{userId}:
    post:
      operationId: addUserToCompany
      summary: Add user to company
      description: Grant a user access to a company
      tags: [Companies]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User added to company

        "429":
          $ref: "#/components/responses/TooManyRequests"
    delete:
      operationId: removeUserFromCompany
      summary: Remove user from company
      description: Revoke a user's access to a company
      tags: [Companies]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User removed from company

        "429":
          $ref: "#/components/responses/TooManyRequests"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ============================================================================
    # Common Schemas
    # ============================================================================
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object

    Pagination:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        totalPages:
          type: integer

    # ============================================================================
    # Health Schemas
    # ============================================================================
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          properties:
            database:
              type: string
              enum: [ok, error]
            redis:
              type: string
              enum: [ok, error]
        signing:
          type: object
          properties:
            enabled:
              type: boolean
            certificateValid:
              type: boolean
            defaultVersion:
              type: string

    VersionResponse:
      type: object
      properties:
        name:
          type: string
        version:
          type: string
        commit:
          type: string
        buildTime:
          type: string

    # ============================================================================
    # Authentication Schemas
    # ============================================================================
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          description: Access token expiry in seconds
        user:
          $ref: "#/components/schemas/User"

    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer

    CurrentUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/Company"

    # ============================================================================
    # Submission Schemas
    # ============================================================================
    InvoiceItem:
      type: object
      required: [description, quantity, unitPrice, taxCode, taxRate, taxAmount, total]
      properties:
        description:
          type: string
        quantity:
          type: number
        unitPrice:
          type: number
        discount:
          type: number
          default: 0
        taxCode:
          type: string
          description: "Tax code (01=SST, 02=Service Tax, E=Exempt)"
        taxRate:
          type: number
        taxAmount:
          type: number
        total:
          type: number

    BuyerInfo:
      type: object
      required: [name, idType, idValue, address, city, state, postalCode]
      properties:
        tin:
          type: string
          description: Tax Identification Number
        name:
          type: string
        idType:
          type: string
          enum: [NRIC, PASSPORT, BRN, ARMY]
        idValue:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
          description: State code (01-16)
        postalCode:
          type: string
        phone:
          type: string
        email:
          type: string

    Invoice:
      type: object
      required: [invoiceNumber, invoiceDate, amount, discount, rounding, taxAmount, total, items]
      properties:
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
          format: date-time
        amount:
          type: number
        discount:
          type: number
        rounding:
          type: number
        taxAmount:
          type: number
        total:
          type: number
        buyer:
          $ref: "#/components/schemas/BuyerInfo"
        items:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceItem"

    SubmitConsolidateRequest:
      type: object
      required: [companyId, invoices]
      properties:
        companyId:
          type: string
        documentVersion:
          type: string
          enum: ["1.0", "1.1"]
          default: "1.0"
        buyerEmail:
          type: string
          format: email
        invoices:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Invoice"

    SubmitJustSaveRequest:
      type: object
      required: [companyId, invoice]
      properties:
        companyId:
          type: string
        invoice:
          $ref: "#/components/schemas/Invoice"

    SubmitBuyerRequest:
      type: object
      required: [companyId, invoice]
      properties:
        companyId:
          type: string
        documentVersion:
          type: string
          enum: ["1.0", "1.1"]
          default: "1.0"
        invoice:
          allOf:
            - $ref: "#/components/schemas/Invoice"
            - type: object
              required: [buyer]

    SubmitPersonalRequest:
      type: object
      required: [companyId, invoice]
      properties:
        companyId:
          type: string
        documentVersion:
          type: string
          enum: ["1.0", "1.1"]
          default: "1.0"
        invoice:
          allOf:
            - $ref: "#/components/schemas/Invoice"
            - type: object
              required: [buyer]

    SubmissionResponse:
      type: object
      properties:
        trackingId:
          type: string
        invoiceId:
          type: string
        status:
          type: string
          enum: [DRAFT, SUBMITTED, VALID, INVALID, CANCELLED]
        message:
          type: string
        submittedAt:
          type: string
          format: date-time

    InvoiceDetails:
      type: object
      properties:
        trackingId:
          type: string
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
        invoiceType:
          type: string
        status:
          type: string
        myinvoisUuid:
          type: string
        myinvoisLongId:
          type: string
        amount:
          type: string
        discount:
          type: string
        rounding:
          type: string
        taxAmount:
          type: string
        total:
          type: string
        errorCode:
          type: string
        errorMessage:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    # ============================================================================
    # Document Schemas
    # ============================================================================
    DocumentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            properties:
              trackingId:
                type: string
              invoiceNumber:
                type: string
              invoiceDate:
                type: string
              invoiceType:
                type: string
              status:
                type: string
              myinvoisUuid:
                type: string
              total:
                type: string
              createdAt:
                type: string
        pagination:
          $ref: "#/components/schemas/Pagination"

    DocumentStatusResponse:
      type: object
      properties:
        uuid:
          type: string
        longId:
          type: string
        status:
          type: string
        invoiceNumber:
          type: string
        invoiceDate:
          type: string
        total:
          type: string
        errorCode:
          type: string
        errorMessage:
          type: string
        updatedAt:
          type: string

    DocumentPdfResponse:
      type: object
      properties:
        uuid:
          type: string
        invoiceNumber:
          type: string
        document:
          type: string
        format:
          type: string
        message:
          type: string

    # ============================================================================
    # User Schemas
    # ============================================================================
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        isActive:
          type: boolean
        role:
          $ref: "#/components/schemas/Role"
        companies:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        createdAt:
          type: string
        updatedAt:
          type: string

    CreateUserRequest:
      type: object
      required: [email, password, name, roleId]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
        roleId:
          type: string
        companyIds:
          type: array
          items:
            type: string

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        isActive:
          type: boolean
        password:
          type: string
          minLength: 8

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ============================================================================
    # Role Schemas
    # ============================================================================
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string
        isSystem:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    CreateRoleRequest:
      type: object
      required: [name, permissions]
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    UpdateRoleRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        permissions:
          type: array
          items:
            type: string

    RoleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        pagination:
          $ref: "#/components/schemas/Pagination"

    # ============================================================================
    # Company Schemas
    # ============================================================================
    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        tin:
          type: string
        idType:
          type: string
        idValue:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        phone:
          type: string
        email:
          type: string
        isActive:
          type: boolean
        myinvoisEnv:
          type: string
          enum: [SANDBOX, PROD]
        hasCredentials:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    CreateCompanyRequest:
      type: object
      required: [name, tin, idType, idValue]
      properties:
        name:
          type: string
        tin:
          type: string
        idType:
          type: string
          enum: [BRN, NRIC, PASSPORT, ARMY]
        idValue:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        phone:
          type: string
        email:
          type: string
        myinvoisEnv:
          type: string
          enum: [SANDBOX, PROD]
          default: SANDBOX

    UpdateCompanyRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        state:
          type: string
        postalCode:
          type: string
        phone:
          type: string
        email:
          type: string
        isActive:
          type: boolean
        myinvoisEnv:
          type: string
          enum: [SANDBOX, PROD]

    UpdateCredentialsRequest:
      type: object
      required: [myinvoisClientId, myinvoisClientSecret]
      properties:
        myinvoisClientId:
          type: string
        myinvoisClientSecret:
          type: string

    CompanyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Company"
        pagination:
          $ref: "#/components/schemas/Pagination"
