openapi: 3.0.3
info:
  contact:
    email: hello@zahidaramai.com
    name: KLCUBE NETWORK Enterprise
  description: |
    API middleware gateway for Malaysia's MyInvois e-invoicing system (LHDN).

    **Client:** Hashmato | **Version:** 1.1.1

    ## Features
    - 4 Submission Endpoints (Consolidate, JustSave, Buyer, Personal)
    - JWT Authentication with Access & Refresh Tokens
    - User/Role/Company Management
    - Document Operations (List, Status, PDF, Cancel)
    - Digital Signing v1.1 (XAdES signatures)
    - Background Status Polling

    ## Authentication
    All endpoints except `/api/v1/auth/login` require JWT authentication.
    Include the access token in the Authorization header:
    ```
    Authorization: Bearer <access_token>
    ```
  title: HashLHDN MyInvois Middleware API
  version: 1.1.1
servers:
- description: Local Development
  url: http://localhost:3000
- description: Production
  url: https://api.hashlhdn.com
tags:
- description: Health and readiness checks
  name: Health
- description: JWT authentication endpoints
  name: Authentication
- description: Invoice submission endpoints
  name: HashLHDN Submission
- description: Document operations
  name: Documents
- description: User management
  name: Users
- description: Role management
  name: Roles
- description: Company management
  name: Companies
paths:
  /healthz:
    get:
      description: Returns OK if the gateway is running
      operationId: healthCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthCheck_200_response'
          description: Gateway is healthy
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Rate limit exceeded
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              explode: false
              schema:
                type: integer
              style: simple
      summary: Health check
      tags:
      - Health
  /readyz:
    get:
      description: "Returns OK if all dependencies (DB, Redis) are connected"
      operationId: readinessCheck
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
          description: Gateway is ready
        "429":
