        required: true
        schema:
          minLength: 1
          type: string
        style: form
      - description: ID type for validation
        explode: true
        in: query
        name: idType
        required: true
        schema:
          enum:
          - NRIC
          - PASSPORT
          - BRN
          - ARMY
          type: string
        style: form
      - description: ID value corresponding to idType
        explode: true
        in: query
        name: idValue
        required: true
        schema:
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TinValidationResponse'
          description: Validation result
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request parameters
          headers:
