openapi: 3.0.3
info:
  contact:
    name: GitHub Issues
    url: https://github.com/user/myinvois-middleware/issues
  description: |
    Open-source middleware gateway for Malaysia's MyInvois e-invoicing system.
    Provides a simplified REST API layer between applications and the official LHDN MyInvois API.

    **Note**: This is an unofficial community project. See DISCLAIMER.md.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: MyInvois Middleware Gateway
  version: 0.1.0
servers:
- description: Local development
  url: http://localhost:3000
- description: Production (placeholder)
  url: https://api.example.com
tags:
- description: Health and readiness checks
  name: Health
- description: Session management for MyInvois authentication
  name: Sessions
- description: Document submission and status tracking
  name: Submissions
- description: Document state management (cancel/reject) and details
  name: Documents
- description: Taxpayer validation utilities
  name: Taxpayer
paths:
  /healthz:
    get:
      description: Returns OK if the gateway is running
      operationId: getHealth
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Gateway is healthy
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Health check
      tags:
      - Health
  /readyz:
    get:
      description: "Returns OK if the gateway is ready to accept requests (DB, Redis\
        \ connected)"
      operationId: getReady
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
          description: Gateway is ready
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Gateway is not ready
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Readiness check
      tags:
      - Health
  /version:
    get:
      description: Returns gateway version and build information
      operationId: getVersion
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'
          description: Version information
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Version information
      tags:
      - Health
  /v1/sessions:
    post:
      description: |
        Creates a gateway session and authenticates with MyInvois.
        For INTERMEDIARY mode, onBehalfOf is required.
      operationId: createSession
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: Session created
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request parameters
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication required or failed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Create a session
      tags:
      - Sessions
  /v1/sessions/{sessionId}:
    delete:
      description: Invalidates the session and clears cached tokens
      operationId: deleteSession
      parameters:
      - description: Gateway session ID
        explode: false
        in: path
        name: sessionId
        required: true
        schema:
          pattern: "^sess_[a-zA-Z0-9]+$"
          type: string
        style: simple
      responses:
        "204":
          description: Session deleted
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Resource not found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Delete a session
      tags:
      - Sessions
    get:
      description: Returns session metadata (no secrets)
      operationId: getSession
      parameters:
      - description: Gateway session ID
        explode: false
        in: path
        name: sessionId
        required: true
        schema:
          pattern: "^sess_[a-zA-Z0-9]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: Session details
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Resource not found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Get session details
      tags:
      - Sessions
  /v1/submissions:
    post:
      description: |
        Submits documents to MyInvois and returns a tracking ID.
        Constraints: max 100 documents, max 5MB total, max 300KB per document.
      operationId: createSubmission
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreateRequest'
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResult'
          description: Submission accepted
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request parameters
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication required or failed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Duplicate submission or validation error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Submit documents
      tags:
      - Submissions
  /v1/submissions/{trackingId}:
    get:
      description: Returns current submission status and document details
      operationId: getSubmission
      parameters:
      - description: Gateway tracking ID for submission
        explode: false
        in: path
        name: trackingId
        required: true
        schema:
          pattern: "^trk_[a-zA-Z0-9]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatus'
          description: Submission status
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Resource not found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Get submission status
      tags:
      - Submissions
  /v1/submissions/{trackingId}/poll:
    post:
      description: |
        Triggers an immediate poll of submission status from MyInvois.
        Returns 409 if polling too frequently (minimum 3s interval).
      operationId: pollSubmission
      parameters:
      - description: Gateway tracking ID for submission
        explode: false
        in: path
        name: trackingId
        required: true
        schema:
          pattern: "^trk_[a-zA-Z0-9]+$"
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionStatus'
          description: Poll completed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Resource not found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Polling too frequently
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Trigger immediate poll
      tags:
      - Submissions
  /v1/documents/{uuid}/cancel:
    post:
      description: Cancels a submitted document (changes state to cancelled)
      operationId: cancelDocument
      parameters:
      - description: MyInvois document UUID
        explode: false
        in: path
        name: uuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentStateChangeRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStateChangeResponse'
          description: Document cancelled
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request parameters
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication required or failed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Insufficient permissions
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Resource not found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Cancel a document
      tags:
      - Documents
  /v1/documents/{uuid}/reject:
    post:
      description: Rejects a received document (changes state to rejected)
      operationId: rejectDocument
      parameters:
      - description: MyInvois document UUID
        explode: false
        in: path
        name: uuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocumentStateChangeRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentStateChangeResponse'
          description: Document rejected
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request parameters
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication required or failed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Insufficient permissions
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Resource not found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Reject a document
      tags:
      - Documents
  /v1/documents/{uuid}/details:
    get:
      description: |
        Returns detailed document information including validation errors.
        Note: Use only for retrieving error details for invalid documents,
        not for submission status monitoring.
      operationId: getDocumentDetails
      parameters:
      - description: MyInvois document UUID
        explode: false
        in: path
        name: uuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: Gateway session ID
        explode: true
        in: query
        name: sessionId
        required: true
        schema:
          pattern: "^sess_[a-zA-Z0-9]+$"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentDetails'
          description: Document details
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication required or failed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Resource not found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Get document details
      tags:
      - Documents
  /v1/documents/{uuid}/raw/{longId}:
    get:
      description: |
        Retrieves the raw document content (UBL XML or JSON) from MyInvois.
        Requires both the document UUID and Long ID.
        Rate limit: 125 RPM per clientId.
      operationId: getRawDocument
      parameters:
      - description: MyInvois document UUID
        explode: false
        in: path
        name: uuid
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - description: MyInvois document Long ID (used for raw document retrieval)
        explode: false
        in: path
        name: longId
        required: true
        schema:
          minLength: 1
          type: string
        style: simple
      - description: Gateway session ID
        explode: true
        in: query
        name: sessionId
        required: true
        schema:
          pattern: "^sess_[a-zA-Z0-9]+$"
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawDocumentResponse'
          description: Raw document content
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Invalid request parameters
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Authentication required or failed
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Resource not found
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Rate limit exceeded
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          description: Internal server error
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
      summary: Get raw document content
      tags:
      - Documents
  /v1/documents/recent:
    get:
      description: |
        Lists recently processed documents with optional filters.
        Results are paginated. Rate limit: 60 RPM per clientId.

        Note: This endpoint is for listing/searching documents,
        not for monitoring submission status (use GET /v1/submissions/{trackingId} instead).
      operationId: getRecentDocuments
      parameters:
      - description: Gateway session ID
        explode: true
        in: query
        name: sessionId
        required: true
        schema:
          pattern: "^sess_[a-zA-Z0-9]+$"
          type: string
        style: form
      - description: "Page number (1-based, default 1)"
        explode: true
        in: query
        name: pageNo
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - description: "Page size (default 10, max 100)"
        explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 10
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Filter by submission date from (ISO 8601)
        explode: true
        in: query
        name: submissionDateFrom
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter by submission date to (ISO 8601)
        explode: true
        in: query
        name: submissionDateTo
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter by issue date from (ISO 8601)
        explode: true
        in: query
        name: issueDateFrom
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Filter by issue date to (ISO 8601)
        explode: true
        in: query
        name: issueDateTo
        required: false
        schema:
          format: date-time
