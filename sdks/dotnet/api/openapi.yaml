      operationId: listDocuments
      parameters:
      - explode: true
        in: query
        name: companyId
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: status
        required: false
        schema:
          enum:
          - DRAFT
          - SUBMITTED
          - VALID
          - INVALID
          - CANCELLED
          type: string
        style: form
      - explode: true
        in: query
        name: invoiceType
        required: false
        schema:
          enum:
          - CONSOLIDATE
          - JUSTSAVE
          - BUYER
          - PERSONAL
          type: string
        style: form
      - explode: true
        in: query
        name: fromDate
        required: false
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: toDate
        required: false
        schema:
          format: date
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      responses:
